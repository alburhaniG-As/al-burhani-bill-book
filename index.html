<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1B64A8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

</head><body>
<title>Al Burhani Bill Book</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Gujarati:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap">
<style>
/* Layout: slim brand header, tab row on desktop and bottom tab bar on phones, one working column.
   Palette from the shop logo: signboard blue and aluminium-section gold. */
:root{
  --bg:#F3F5F9;--surface:#FFFFFF;--surface2:#EAEFF6;--fg:#12203A;--muted:#566783;--line:#D8DFEA;
  --blue:#1B64A8;--blue-fg:#FFFFFF;--blue-soft:#E1EDF8;
  --gold:#F7941D;--gold-fg:#2B1A00;--gold-ink:#8F5300;--gold-soft:#FFF1DC;
  --ok:#1F7A4D;--ok-soft:#DDF3E7;--bad:#B3261E;--bad-soft:#FBE4E2;
  --paper:#FFFFFF;--paper-ink:#18204A;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --disp:'Space Grotesk','Inter',system-ui,sans-serif;
  --gu:'Noto Sans Gujarati','Shruti','Nirmala UI',sans-serif;
  --inv-navy:#155799;--inv-orange:#E67E22;--inv-ink:#1B2430;--inv-mute:#5B6675;--inv-line:#E3E8EF;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1523;--surface:#162033;--surface2:#1D2A41;--fg:#E7ECF5;--muted:#9BA9BF;--line:#2A3955;
  --blue:#5BA3E8;--blue-fg:#08182B;--blue-soft:#17304D;
  --gold:#FFB04A;--gold-fg:#2B1A00;--gold-ink:#FFC678;--gold-soft:#3A2B12;
  --ok:#5FD39A;--ok-soft:#143527;--bad:#FF8A80;--bad-soft:#431B1A;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1523;--surface:#162033;--surface2:#1D2A41;--fg:#E7ECF5;--muted:#9BA9BF;--line:#2A3955;
  --blue:#5BA3E8;--blue-fg:#08182B;--blue-soft:#17304D;
  --gold:#FFB04A;--gold-fg:#2B1A00;--gold-ink:#FFC678;--gold-soft:#3A2B12;
  --ok:#5FD39A;--ok-soft:#143527;--bad:#FF8A80;--bad-soft:#431B1A;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 84px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--disp);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:22px}h2{font-size:17px}h3{font-size:15px}
.wrap{max-width:1040px;margin:0 auto}
.num,.tn{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:12.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1 1 auto}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* header + nav */
.top{display:flex;align-items:center;gap:12px;padding:12px 0 8px}
.top img{height:38px;width:auto;border-radius:6px;background:#fff}
.top .t{min-width:0}.top .t b{display:block;font-family:var(--disp);font-size:15px;line-height:1.15}
.badge{font-size:11.5px;padding:3px 9px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.tabs{display:none;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs a{padding:10px 14px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;border-bottom:3px solid transparent;white-space:nowrap}
.tabs a.on{color:var(--fg);border-bottom-color:var(--gold)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);
  border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
.bar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:600}
.bar a svg{width:22px;height:22px}
.bar a.on{color:var(--blue)}
.bar a.cta span.ic{background:var(--gold);color:var(--gold-fg);border-radius:12px;width:44px;height:30px;display:grid;place-items:center}
@media (min-width:820px){.tabs{display:flex}.bar{display:none}body{padding-block:0 40px}}

/* surfaces + controls */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.pad{padding:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;font-size:14px}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--blue-fg)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--gold-fg)}
.btn.bad{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.in{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;min-width:0}
.in:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 2px var(--blue-soft)}
.in.num{text-align:right}
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:4px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.low{background:var(--gold-soft);color:var(--gold-ink)}.pill.out,.pill.bad{background:var(--bad-soft);color:var(--bad)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--muted)}
.chip.on{background:var(--blue);border-color:var(--blue);color:var(--blue-fg)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 0 10px}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;min-width:0}
.li:first-child{border-top:0}
.li:hover{background:var(--surface2)}
.li .g{flex:1 1 auto;min-width:0}
.li .g b{display:block;overflow-wrap:anywhere}
.li .r{text-align:right;white-space:nowrap}
.empty{padding:26px 16px;text-align:center;color:var(--muted)}
.note{background:var(--gold-soft);color:var(--gold-ink);border-radius:8px;padding:10px 14px;font-size:13.5px}

/* home stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr)}
.stats>div{padding:14px 16px;border-left:1px solid var(--line)}
.stats>div:first-child{border-left:0}
.stats small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.stats strong{font-family:var(--disp);font-size:clamp(16px,4.6vw,21px)}
.stats.s3{grid-template-columns:repeat(3,1fr)}
@media (max-width:620px){.stats:not(.s3){grid-template-columns:1fr 1fr}.stats:not(.s3)>div:nth-child(3){border-left:0}.stats:not(.s3)>div:nth-child(n+3){border-top:1px solid var(--line)}.stats>div{padding:12px}}

/* bill entry */
.billhead{border:2px dashed var(--paper-ink);border-radius:14px;background:var(--paper);color:var(--paper-ink);padding:10px 14px;display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center}
.billhead .gn{font-family:var(--gu);font-weight:700;font-size:23px;line-height:1.2}
.billhead .tg{font-family:var(--gu);font-weight:700;font-size:13px;text-align:center;border:2px solid var(--paper-ink);padding:4px 8px;outline:1px solid var(--paper-ink);outline-offset:2px}
.billhead .ad{grid-column:1/-1;font-family:var(--gu);font-weight:700;font-size:13.5px}
@media (max-width:620px){.billhead{grid-template-columns:1fr}.billhead .gn{font-size:19px}}
.lines{margin-top:14px}
.lh,.line{display:grid;grid-template-columns:26px minmax(0,1.4fr) minmax(0,1fr) 84px 72px 62px 84px 92px 28px;gap:6px;align-items:start}
.lh{font-size:11.5px;font-weight:700;color:var(--muted);padding:0 0 6px;text-transform:uppercase;letter-spacing:.04em}
.line{padding:8px 0;border-top:1px solid var(--line)}
.line .n{padding-top:9px;color:var(--muted);font-size:13px}
.line .a{padding-top:9px;text-align:right;font-weight:700}
.line .x{border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px 0}
.hint{font-size:12px;margin-top:3px;min-height:0}
.hint.bad{color:var(--bad)}.hint.ok{color:var(--muted)}
@media (max-width:700px){
  .lh{display:none}
  .line{grid-template-columns:repeat(4,minmax(0,1fr)) 30px;grid-template-areas:"d d d d x" "e e e e e" "s u q r ." "a a a a a";padding:12px 0}
  .line .n{display:none}.line .d{grid-area:d}.line .e{grid-area:e}.line .s{grid-area:s}.line .u{grid-area:u}.line .q{grid-area:q}.line .r{grid-area:r}.line .a{grid-area:a;padding-top:0}.line .x{grid-area:x}
}
.totals{display:grid;grid-template-columns:1fr minmax(240px,320px);gap:16px;margin-top:14px;align-items:start}
@media (max-width:700px){.totals{grid-template-columns:1fr}}
.tl{display:flex;justify-content:space-between;gap:12px;padding:5px 0}
.tl.big{font-family:var(--disp);font-size:20px;font-weight:700;border-top:2px solid var(--fg);margin-top:4px;padding-top:9px}

/* bill sheet (view + preview) */
.sheet{background:var(--paper);color:var(--paper-ink);border-radius:8px;padding:16px;border:1px solid var(--line);max-width:640px;margin:0 auto}
.sheet .billhead{padding:8px 12px}
.sheet table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
.sheet th,.sheet td{border:1.5px solid var(--paper-ink);padding:6px 8px;text-align:left;vertical-align:top}
.sheet th{font-weight:600;text-align:center}
.sheet td.r{text-align:right}.sheet td.c{text-align:center}
.sheet .meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:14px}
.sheet .foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:12.5px}
.sheet .gu{font-family:var(--gu);font-weight:700}
.stamp{display:inline-block;border:2px solid var(--bad);color:var(--bad);padding:2px 10px;border-radius:6px;font-weight:800;letter-spacing:.08em}

/* invoice: A4 at 794px wide. Same look in light and dark themes, it is paper. */
.inv{width:794px;min-height:1122px;padding:44px 48px 36px;background:#fff;color:var(--inv-ink);font-family:'Noto Sans','Noto Sans Devanagari','Noto Sans Gujarati','Nirmala UI','Shruti',sans-serif;font-size:13px;line-height:1.5;display:flex;flex-direction:column}
.inv *{box-sizing:border-box}
.i-top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
.i-logo{height:78px;width:auto;display:block}
.i-meta{text-align:right;min-width:200px}
.i-title{font-size:26px;font-weight:700;color:var(--inv-navy);line-height:1.15}
.i-bar{width:56px;height:4px;background:var(--inv-orange);margin:8px 0 10px auto;border-radius:2px}
.i-kv{display:flex;justify-content:flex-end;gap:14px;font-size:13px}
.i-kv span{color:var(--inv-mute)}
.i-kv b{min-width:90px;text-align:right}
.i-biz{display:flex;justify-content:space-between;align-items:center;gap:24px;margin-top:22px;padding:16px 0;border-top:2px solid var(--inv-navy);border-bottom:1px solid var(--inv-line)}
.i-name{font-size:16px;font-weight:700;color:var(--inv-navy);margin-bottom:4px}
.i-sm{font-size:12px;color:var(--inv-mute);line-height:1.6}
.i-ig{text-align:center;flex:none}
.i-ig img{width:76px;height:76px;display:block;margin:0 auto 3px}
.i-ig div{font-size:8.5px;color:var(--inv-mute)}
.i-bill{margin-top:20px}
.i-lab{font-size:11px;font-weight:700;color:var(--inv-orange);text-transform:uppercase;margin-bottom:4px}
.i-bn{font-size:15px;font-weight:700}
.i-tbl{width:100%;border-collapse:collapse;margin-top:22px;font-size:12.5px}
.i-tbl th{background:var(--inv-navy);color:#fff;font-weight:700;text-align:left;padding:9px 8px;font-size:12px}
.i-tbl td{padding:9px 8px;border-bottom:1px solid var(--inv-line);vertical-align:top}
.i-tbl .c{text-align:center;width:44px}
.i-tbl .r{text-align:right;font-variant-numeric:tabular-nums}
.i-tbl td.b{font-weight:700}
.i-tbl td.nm{font-weight:600}
.i-tbl td.ds{color:var(--inv-mute)}
.i-tot{margin:18px 0 0 auto;width:310px}
.i-adj{display:flex;justify-content:space-between;gap:12px;padding:5px 8px;font-size:13px;color:var(--inv-mute)}
.i-adj b{color:var(--inv-ink);font-variant-numeric:tabular-nums}
.i-adj.bal b{color:var(--inv-orange)}
.i-gt{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:6px;padding:11px 14px;background:var(--inv-navy);color:#fff;border-bottom:4px solid var(--inv-orange);font-size:15px}
.i-gt span{font-weight:600}
.i-gt b{font-size:18px;font-variant-numeric:tabular-nums}
.i-foot{margin-top:auto;padding-top:36px;text-align:center}
.i-thx{font-size:14px;font-weight:700;color:var(--inv-navy)}
.i-more{font-size:12px;color:var(--inv-mute);margin-top:4px}
.i-note{font-size:11px;color:var(--inv-mute);padding:6px 8px;text-align:right}
.gstbox{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.invwrap{overflow:hidden;border:1px solid var(--line);border-radius:8px;max-width:796px;margin:0 auto;background:#fff}
.invwrap .inv{transform-origin:0 0}
#pdfstage{position:fixed;left:-10000px;top:0;width:794px;z-index:-1}
.fg>.s2{grid-column:span 2}
@media (max-width:380px){.fg>.s2{grid-column:1/-1}}
a.btn{display:inline-block;text-decoration:none}
.btn.wa{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.wa:hover{filter:brightness(1.1);background:var(--ok)}
select.in.auto{width:auto}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:50;background:rgba(8,14,26,.55);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal .box{width:min(520px,100%);max-height:100%;overflow:auto;background:var(--surface);border-radius:12px;padding:18px;border:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13.5px;font-weight:600;max-width:90vw}
@media (min-width:820px){.toast{bottom:28px}}

/* chart */
.chart text{fill:var(--muted);font-size:11px;font-family:var(--sans)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .bar1{fill:var(--blue)}.chart .bar1.now{fill:var(--gold)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{padding:8px 10px;border-top:1px solid var(--line);text-align:left}
table.t th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;border-top:0}
table.t td.r,table.t th.r{text-align:right}
.scroll{overflow-x:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* auth overlay + sync badge */
.badge.warn{background:var(--gold-soft);color:var(--gold-ink)}
.badge.btnb{cursor:pointer;border:1px solid var(--line)}
.authwall{position:fixed;inset:0;z-index:80;background:var(--bg);display:grid;place-items:center;padding:20px;overflow:auto}
.authcard{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.authcard img{height:54px;width:auto;display:block;margin:0 auto 12px;border-radius:6px;background:#fff}
.authcard h1{text-align:center;font-size:20px;margin-bottom:4px}
.authcard .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:18px}
.authcard .err{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:12px}
.authcard .okmsg{background:var(--ok-soft);color:var(--ok);border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:12px}
.authcard .fld{margin-bottom:12px}
.authcard .tabs2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:16px;background:var(--bg);padding:4px;border-radius:9px}
.authcard .tabs2 button{border:0;background:transparent;padding:8px;border-radius:7px;font-weight:600;cursor:pointer;color:var(--muted)}
.authcard .tabs2 button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* v6 enhancements: row add-on, calc, classic B&W invoice, round off, sq.ft helper */
.addon-box{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 10px;background:var(--surface2);border-radius:7px;margin-top:4px}
.addon-btn{border:1px dashed var(--line);background:var(--bg);border-radius:6px;padding:3px 9px;font-size:12px;font-weight:600;color:var(--blue);cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.addon-btn:hover{background:var(--blue-soft)}
.sqft-sub{font-size:11.5px;font-weight:600;color:var(--blue);margin-top:2px;line-height:1.2}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.calc-btn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:12px 6px;font-size:17px;font-weight:700;cursor:pointer;text-align:center}
.calc-btn:hover{background:var(--surface2)}
.calc-btn.op{background:var(--blue-soft);color:var(--blue)}
.calc-btn.eq{background:var(--blue);color:var(--blue-fg)}
.calc-scr{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;text-align:right;font-family:var(--disp);font-size:24px;font-weight:700;min-height:52px;word-break:break-all}
.calc-expr{font-size:12px;color:var(--muted);min-height:18px;text-align:right;margin-bottom:2px}
.chk-row{display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer;font-size:13.5px;font-weight:500}
.chk-row input[type="checkbox"]{width:17px;height:17px;accent-color:var(--blue);cursor:pointer}
.img-prev{max-height:68px;max-width:180px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:4px;display:block;margin-top:6px}

/* Classic Black & White Template (Reference Quotation/Invoice Style) */
.inv.bw{font-family:'Noto Sans','Noto Sans Devanagari','Noto Sans Gujarati',Arial,sans-serif;color:#111;padding:36px 42px 32px}
.bw-doc{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;color:#111}
.bw-box{border:1.5px solid #111}
.bw-hdr{display:grid;grid-template-columns:120px 1fr 120px;align-items:center;padding:12px 16px;border-bottom:1.5px solid #111;gap:12px}
.bw-hdr img{max-height:76px;width:auto;display:block}
.bw-hdr-c{text-align:center}
.bw-hdr-c h2{font-family:inherit;font-size:20px;font-weight:700;color:#111;margin:0 0 3px;letter-spacing:0}
.bw-hdr-c div{font-size:12px;color:#222;line-height:1.45}
.bw-meta{display:grid;grid-template-columns:1.3fr .85fr .85fr;border-bottom:1.5px solid #111}
.bw-meta>div{padding:8px 12px;border-left:1.5px solid #111;font-size:12.5px}
.bw-meta>div:first-child{border-left:0}
.bw-meta .lbl{font-weight:700;text-transform:uppercase;font-size:11px;margin-bottom:2px}
.bw-tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.bw-tbl th{background:#E8E8E8;color:#111;font-weight:700;border-bottom:1.5px solid #111;border-left:1.5px solid #111;padding:7px 8px;text-align:center;font-size:11.5px}
.bw-tbl th:first-child,.bw-tbl td:first-child{border-left:0}
.bw-tbl td{padding:7px 8px;border-left:1.5px solid #111;vertical-align:top}
.bw-tbl td.c{text-align:center}
.bw-tbl td.r{text-align:right;font-variant-numeric:tabular-nums}
.bw-tbl tr.bw-subrow td{padding-top:4px;padding-bottom:4px;font-style:italic}
.bw-tbl tr.bw-totrow td{background:#E8E8E8;border-top:1.5px solid #111;font-weight:700;padding:8px}
.bw-words{border:1.5px solid #111;border-top:0;padding:7px 12px;font-size:12px}
.bw-words b{display:block;font-size:11.5px;margin-bottom:1px}
.bw-paygrid{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid #111;border-top:0}
.bw-paygrid>div{padding:9px 12px;font-size:12px}
.bw-paygrid>div:nth-child(2){border-left:1.5px solid #111}
.bw-paygrid h4{margin:0 0 5px;font-size:12px;font-weight:700}
.bw-kv{display:grid;grid-template-columns:92px 1fr;gap:2px 8px;line-height:1.45}
.bw-qrwrap{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.bw-qrwrap img{width:82px;height:82px;border:1px solid #ccc;padding:2px;background:#fff}
.bw-bot{display:grid;grid-template-columns:1.25fr .75fr;border:1.5px solid #111;border-top:0;min-height:92px}
.bw-terms{padding:8px 12px;font-size:11.5px;line-height:1.45}
.bw-terms b{display:block;margin-bottom:3px;font-size:12px}
.bw-sign{padding:8px 12px;text-align:center;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.bw-sign img{max-height:54px;max-width:170px;object-fit:contain;margin-bottom:3px}
.bw-sign .sig-line{border-top:1px solid #444;width:160px;margin:28px auto 4px}
.bw-sign div{font-size:11px;font-weight:600;line-height:1.3}
.i-paybox{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px;padding:12px 14px;border:1px solid var(--inv-line);border-radius:6px;background:#FAFBFD;font-size:12px}
.i-signrow{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-top:20px;padding-top:10px;border-top:1px solid var(--inv-line);font-size:11.5px}
.i-signbox{text-align:center;min-width:180px}
.i-signbox img{max-height:52px;max-width:165px;object-fit:contain;display:block;margin:0 auto 3px}

/* v6.2 refinements: clean logo & header, green dot sync badge, floating calculator button, theme & animations */
.top{display:flex;align-items:center;gap:10px;padding:10px 0 8px;flex-wrap:nowrap}
.top img{height:40px;width:40px;object-fit:contain;border-radius:0;background:transparent;flex:none;transition:transform .22s ease}
.top img:hover{transform:scale(1.04)}
.top .t{flex:1 1 auto;min-width:0}
.top .t b{display:block;font-family:var(--disp);font-size:15.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .t span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.authcard img{background:transparent!important;border-radius:0!important}

.syncdot-btn{width:28px;height:28px;border-radius:99px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none;padding:0;transition:transform .18s ease,box-shadow .2s ease}
.syncdot-btn:hover{transform:scale(1.06)}
.syncdot{width:11px;height:11px;border-radius:99px;background:#22C55E;box-shadow:0 0 0 3px rgba(34,197,94,.22);transition:background .25s ease,box-shadow .25s ease}
.syncdot.warn{background:#F59E0B;box-shadow:0 0 0 3px rgba(245,158,11,.24)}
.syncdot.syncing{background:#3B82F6;box-shadow:0 0 0 3px rgba(59,130,246,.24);animation:pulseDot 1.2s infinite}
@keyframes pulseDot{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.22);opacity:.72}}

.calc-fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:35;width:48px;height:48px;border-radius:99px;border:1px solid var(--blue);background:var(--blue);color:var(--blue-fg);box-shadow:0 6px 18px rgba(18,32,58,.24);display:grid;place-items:center;cursor:pointer;transition:transform .2s cubic-bezier(.22,1,.36,1),box-shadow .2s ease,filter .2s ease}
.calc-fab:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 10px 22px rgba(18,32,58,.3)}
.calc-fab:active{transform:scale(.95)}
@media (min-width:820px){.calc-fab{bottom:24px;right:24px}}

@keyframes viewFadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
#view{animation:viewFadeIn .22s cubic-bezier(.22,1,.36,1)}
@keyframes modalPopIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal .box{animation:modalPopIn .2s cubic-bezier(.22,1,.36,1)}
.panel,.li,.btn,.chip{transition:background-color .18s ease,border-color .18s ease,transform .16s ease,box-shadow .18s ease}
.li:active{transform:scale(.99)}
.btn:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){#view,.modal .box,.syncdot,.calc-fab,.panel,.li,.btn,.chip{animation:none!important;transition:none!important}}
</style>

function words(n){
  n=Math.round(Math.abs(n));if(n===0)return 'Zero';
  const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Ninety'.replace('Ninety','Nineteen')];
  const b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const two=x=>x<20?a[x]:b[Math.floor(x/10)]+(x%10?' '+a[x%10]:'');
  const three=x=>{let s='';if(x>=100){s=a[Math.floor(x/100)]+' Hundred';x%=100;if(x)s+=' ';}return s+(x?two(x):'')};
  const out=[];const cr=Math.floor(n/1e7);n%=1e7;const lk=Math.floor(n/1e5);n%=1e5;const th=Math.floor(n/1e3);n%=1e3;
  if(cr)out.push(three(cr)+' Crore');if(lk)out.push(two(lk)+' Lakh');if(th)out.push(two(th)+' Thousand');if(n)out.push(three(n));
  return out.join(' ');
}
function amtWords(v){const t=r2(Math.abs(v));const rup=Math.floor(t);const p=Math.round((t-rup)*100);

/* Size Sq.Ft helper: parses e.g. 25x10, 25 x 10, 25*10, 25×10 -> 250 sq.ft */
function parseSqFt(sz){
  const m=String(sz||'').trim().match(/^(\d+(?:\.\d+)?)\s*[xX×*]\s*(\d+(?:\.\d+)?)$/);
  if(!m)return 0;
  const w=parseFloat(m[1]),h=parseFloat(m[2]);
  if(!(w>0&&h>0))return 0;
  return r2(w*h);
}
function sqFtLabel(sz){
  const sf=parseSqFt(sz);
  return sf>0?(sf.toLocaleString('en-IN',{maximumFractionDigits:2})+' sq.ft'):'';
}

async function put(c,id,obj){
  obj=clone(obj);S[c][id]=obj;saveLocal();
  if(db&&curUser){
    try{
      const p=db.collection(c).doc(id).set(obj);
      if(navigator.onLine)await p;
    }catch(e){fail(e)}
  }

function stopSync(){unsubs.forEach(fn=>{try{fn()}catch(e){}});unsubs=[];db=null}
function startSync(user){
  stopSync();
  curUser=user;
  loadLocal();
  db=fs.collection('users').doc(user.uid);
  mode='cloud';
  const pendingCols={};
  COLS.forEach(c=>{
    const u=db.collection(c).onSnapshot({includeMetadataChanges:true},snap=>{
      const o={};
      snap.docs.forEach(d=>{o[d.id]=d.data()});
      if(!snap.metadata.fromCache||snap.docs.length>0||Object.keys(S[c]).length===0){
        S[c]=o;saveLocal();
      }
      pendingCols[c]=snap.metadata.hasPendingWrites;
      hasPending=Object.values(pendingCols).some(Boolean);
      refreshSoft();
    },err=>{
      console.error('Firestore sync error:',err);
      if(err&&err.code==='permission-denied')toast('Firestore rules blocked access. Check rules.');
      setBadge();
    });
    unsubs.push(u);
  });
  setBadge();render();
}

async function boot(){

    navigator.serviceWorker.register('./sw.js').catch(()=>{});

  const sb=$('#syncbadge');
  if(sb)sb.onclick=openAccountModal;

  render();

    try{
      if(!firebase.apps.length)firebase.initializeApp(window.FIREBASE_CONFIG);
      auth=firebase.auth();
      fs=firebase.firestore();
      try{await fs.enablePersistence({synchronizeTabs:true})}catch(e){}
      auth.onAuthStateChanged(user=>{
        if(user){
          $('#authwall').hidden=true;
          startSync(user);
        }else{
          stopSync();curUser=null;clearState();setBadge();render();
          showAuthWall();

    loadLocal();setBadge();render();

  }
}

let calcState={expr:'',disp:'0',fresh:true};
function calcPress(k){
  if(k==='C'){calcState={expr:'',disp:'0',fresh:true};updateCalcUI();return}
  if(k==='BS'){
    if(calcState.disp.length>1)calcState.disp=calcState.disp.slice(0,-1);
    else{calcState.disp='0';calcState.fresh=true}
    updateCalcUI();return;
  }
  if(k==='='){
    try{
      const full=(calcState.expr+calcState.disp).replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
      if(/^[0-9+\-*/.%()\s]+$/.test(full)){
        const res=Function('"use strict";return ('+full+')')();
        if(isFinite(res)){
          calcState.expr=full+' =';
          calcState.disp=String(r2(res));
          calcState.fresh=true;
        }
      }
    }catch(e){toast('Invalid calculation')}
    updateCalcUI();return;
  }
  if(['+','-','*','/','%'].includes(k)){
    calcState.expr=(calcState.fresh&&calcState.expr.endsWith('=')?calcState.disp:calcState.expr+calcState.disp)+' '+k+' ';
    calcState.fresh=true;
    updateCalcUI();return;
  }
  if(k==='.'){
    if(calcState.fresh){calcState.disp='0.';calcState.fresh=false}
    else if(!calcState.disp.includes('.'))calcState.disp+='.';
    updateCalcUI();return;
  }
  if(calcState.fresh||calcState.disp==='0'){calcState.disp=k;calcState.fresh=false}
  else calcState.disp+=k;
  updateCalcUI();
}
function updateCalcUI(){
  const e=$('#calc-expr'),d=$('#calc-disp');
  if(e)e.textContent=calcState.expr;
  if(d)d.textContent=calcState.disp;
}

async function memFlush(){
  clearTimeout(memTimer);
  const pend=memPend;memPend={};
  const cur=clone(S.memory.main||{});let changed=false;
  Object.keys(pend).forEach(k=>{
    let arr=cur[k]||[];
    pend[k].forEach(v=>{
      if(arr[0]===v)return;
      arr=[v].concat(arr.filter(x=>String(x).toLowerCase()!==v.toLowerCase())).slice(0,MEM_MAX);changed=true;
    });
    cur[k]=arr;
  });
  if(changed){await put('memory','main',cur);memDirty=true}
}
function uniqOpts(list){
  const seen={},out=[];
  list.forEach(v=>{const k=String(v).toLowerCase();if(v&&!seen[k]){seen[k]=1;out.push('<option value="'+esc(v)+'"></option>')}});
  return out.join('');
}

  $('#units').innerHTML=uniqOpts(UNITS.concat(memArr('unit')));

  $('#custs').innerHTML=uniqOpts(Object.values(customersMap()).map(c=>c.name).concat(memArr('cust')));

  if(ml)ml.innerHTML=MEM_KINDS.map(k=>'<datalist id="m-'+k+'">'+uniqOpts(memArr(k))+'</datalist>').join('');
}
document.addEventListener('focusin',e=>{
  const k=memKind(e.target);if(!k)return;

function billTotals(d){
  let sub=0;d.items.forEach(l=>{sub+=lineAmt(l)});sub=r2(sub);
  const fitAmt=d.fittingOpen?r2(num(d.fittingAmt)):0;
  const delAmt=d.deliveryOpen?r2(num(d.deliveryAmt)):0;
  const extraCharges=r2(fitAmt+delAmt);
  const beforeDisc=r2(sub+extraCharges);
  const discPct=r2(num(d.discPct));
  const pctDiscAmt=discPct>0?r2(beforeDisc*discPct/100):0;
  const adj=r2(num(d.adj));
  const taxable=r2(Math.max(0,beforeDisc-pctDiscAmt+adj));
  const rate=d.type==='gst'?num(d.gstRate):0;
  const tax=r2(taxable*rate/100);
  const rawTotal=r2(taxable+tax);
  const roundedTotal=Math.round(rawTotal);
  const roundAmt=d.roundOff?r2(roundedTotal-rawTotal):0;
  const total=r2(rawTotal+roundAmt);
  const est=d.type==='estimate';
  const paid=est?0:(d.pay==='full'?total:(d.pay==='credit'?0:Math.min(num(d.part),total)));
  return{sub,fitAmt,delAmt,extraCharges,beforeDisc,discPct,pctDiscAmt,adj,taxable,rate,tax,rawTotal,roundAmt,total,paid:r2(paid),bal:est?0:r2(total-paid)};
}
const setT=(id,v)=>{const e=$(id);if(e)e.textContent=v};
function recalc(){
  if(!draft)return;
  document.querySelectorAll('#rows .line').forEach((el,i)=>{
    const l=draft.items[i];if(!l)return;
    const a=lineAmt(l);
    el.querySelector('[data-amt]').textContent=a?inr(a):'₹0';
    const sqEl=el.querySelector('[data-sqft]');
    if(sqEl){const sf=sqFtLabel(l.size);sqEl.textContent=sf;sqEl.hidden=!sf}
    const h=el.querySelector('[data-hint]');let msg='',cls='ok';
    const p=l.pid&&S.products[l.pid];
    if(p){msg='In stock: '+num(p.stock)+' '+(p.unit||'');if(num(l.qty)>num(p.stock)){msg='Only '+num(p.stock)+' '+(p.unit||'')+' in stock';cls='bad'}}
    h.textContent=msg;h.className='hint '+cls;
  });
  const t=billTotals(draft);
  setT('#t-sub',inr(t.sub));
  const discRow=$('#disc-row');
  if(discRow){
    discRow.hidden=!(t.pctDiscAmt>0);
    setT('#t-disclab','Discount ('+t.discPct+'%)');
    setT('#t-discamt','− '+inr(t.pctDiscAmt));
  }
  setT('#t-tax',inr(t.tax));
  const rndRow=$('#rnd-row');
  if(rndRow){
    rndRow.hidden=!(draft.roundOff&&t.roundAmt!==0);
    setT('#t-rnd',(t.roundAmt>0?'+ ':'− ')+inr(Math.abs(t.roundAmt)));
  }
  setT('#t-total',inr(t.total));setT('#t-paid',inr(t.paid));setT('#t-bal',inr(t.bal));
  setT('#words',t.total>0?amtWords(t.total):'');
}

function onBillInput(e){
  const t=e.target;if(!draft)return;
  if(t.dataset&&t.dataset.bchk){
    draft[t.dataset.bchk]=!!t.checked;
    return;
  }
  const lineEl=t.closest&&t.closest('.line');
  if(lineEl&&t.dataset.f){
    const i=+lineEl.dataset.i,l=draft.items[i];if(!l)return;
    l[t.dataset.f]=t.value;
    if(t.dataset.f==='name'){
      const p=matchProduct(t.value);
      if(p)applyProduct(i,p);
      else if(l.pid){const q=S.products[l.pid];if(!q||(t.value!==q.name&&t.value!==prodLabel(Object.assign({id:l.pid},q))))l.pid=''}
    }
    recalc();return;
  }
  if(t.dataset.b){
    const k=t.dataset.b;draft[k]=t.value;
    if(['part','adj','gstRate','discPct','fittingAmt','deliveryAmt'].includes(k))recalc();
    if(k==='type'){draft.no=nextNo(draft.type);render();return}
    if(k==='branch'){pref.branch=t.value;savePref()}
    if(k==='lang'){pref.lang=t.value;savePref()}
    if(k==='tpl'){pref.tpl=t.value;savePref()}
  }
}
function validateBill(d){
  const items=d.items.filter(l=>(l.name||'').trim()||num(l.qty)||num(l.rate));
  if(!items.length)return{err:'Add at least one item.'};
  for(const l of items){
    if(!(l.name||'').trim())return{err:'An item has no name.'};
    if(!(num(l.qty)>0))return{err:'Enter a quantity for '+l.name+'.'};
    if(!(num(l.rate)>0))return{err:'Enter a rate for '+l.name+'.'};
  }
  const t=billTotals(Object.assign({},d,{items}));
  if(!(t.total>0))return{err:'The total must be more than zero.'};
  if(t.bal>0&&!(d.customer||'').trim())return{err:'Enter the customer name for a bill with a balance due.'};
  const no=Math.floor(num(d.no));
  if(no<1)return{err:'Enter a valid bill number.'};
  return{items,t,no};
}
async function saveBill(){
  const d=draft;const v=validateBill(d);
  if(v.err){toast(v.err);return}
  const bno=d.type==='estimate'?'E'+v.no:v.no;
  if(S.bills['B'+bno]){toast((d.type==='estimate'?'Estimate':'Bill')+' no. '+v.no+' already exists. Use the next number.');return}
  const btn=$('#savebtn');btn.disabled=true;
  const items=v.items.map(l=>{
    const aAmt=r2(num(l.addonAmt));
    const aName=(l.addonName||'').trim();
    return{
      pid:l.pid||'',name:l.name.trim(),desc:(l.desc||'').trim(),size:(l.size||'').trim(),unit:(l.unit||'').trim(),
      qty:num(l.qty),rate:num(l.rate),
      addonName:(aAmt>0||aName)?aName:'',addonAmt:aAmt>0?aAmt:0,
      amt:lineAmt(l),cat:l.cat||''
    };
  });
  const br=branches()[Math.max(0,Math.floor(num(d.branch)))]||shop().br1;
  const gstB=d.type==='gst';
  const sg=gstB?String(d.shopGstin!==undefined?d.shopGstin:(shop().gstin||'')).trim().toUpperCase():'';
  const fitAmt=d.fittingOpen?r2(num(d.fittingAmt)):0;
  const delAmt=d.deliveryOpen?r2(num(d.deliveryAmt)):0;
  const bill={
    no:bno,type:d.type||'normal',tpl:d.tpl||shop().defaultTpl||'modern',
    gstRate:gstB?num(d.gstRate):0,gstSplit:d.gstSplit||'intra',shopGstin:sg,
    buyerGstin:gstB?(d.buyerGstin||'').trim().toUpperCase():'',hsn:gstB?(d.hsn||'').trim():'',
    taxable:v.t.taxable,tax:v.t.tax,date:d.date||today(),
    customer:(d.customer||'').trim(),phone:(d.phone||'').trim(),address:(d.address||'').trim(),
    branch:br,lang:d.lang||'en',items,
    sub:v.t.sub,
    fittingName:fitAmt>0?((d.fittingName||'Fitting Charges').trim()):'',fittingAmt:fitAmt,
    deliveryName:delAmt>0?((d.deliveryName||'Delivery / Transport Charges').trim()):'',deliveryAmt:delAmt,
    discPct:v.t.discPct,discAmt:v.t.pctDiscAmt,
    adj:v.t.adj,
    roundOff:!!d.roundOff,roundAmt:v.t.roundAmt,
    showBank:!!d.showBank,showQr:!!d.showQr,
    total:v.t.total,paid:v.t.paid,
    method:d.type==='estimate'?'Estimate':(d.pay==='credit'?'Credit':d.method),
    note:(d.note||'').trim(),status:'active',created:Date.now()
  };
  await put('bills','B'+bno,bill);
  const per={};if(d.type!=='estimate')items.forEach(l=>{if(l.pid&&S.products[l.pid])per[l.pid]=(per[l.pid]||0)+l.qty});
  for(const pid of Object.keys(per)){
    const p=clone(S.products[pid]);p.stock=r2(num(p.stock)-per[pid]);
    p.log=(p.log||[]).concat([{d:bill.date,t:'sale',q:-per[pid],ref:'Bill '+v.no}]).slice(-40);
    await put('products',pid,p);
  }
  const sh=Object.assign({},S.shop.main||{},d.type==='estimate'?{nextEst:v.no+1}:{nextBill:v.no+1},sg?{gstin:sg}:{});
  await put('shop','main',sh);
  draft=null;btn.disabled=false;ui.vlang='';ui.vtpl='';ui.vbill='';
  memAdd('cust',bill.customer);memAdd('addr',bill.address);memAdd('note',bill.note);memAdd('gstin',bill.buyerGstin);memAdd('hsn',bill.hsn);
  items.forEach(l=>{memAdd('item',l.name);memAdd('desc',l.desc);memAdd('size',l.size);memAdd('unit',l.unit);if(l.addonName)memAdd('addon',l.addonName)});
  await memFlush();
  toast((d.type==='estimate'?'Estimate ':'Bill ')+v.no+' saved');
  location.hash='#view-'+bno;
}

function signBlockHTML(s,cls){
  const img=s.signImg?`<img src="${s.signImg}" alt="Signature">`:'<div class="sig-line"></div>';
  return `<div class="${cls}">${img}<div>Authorised Signatory For<br>${esc(s.name)}</div></div>`;
}

function invoiceBWHTML(b,lang){
  const T=I18N[lang]||I18N.en,s=shop();
  const type=b.type||'normal',gst=type==='gst',est=type==='estimate';
  const logo=shopLogo();
  const payQr=s.qrImg||QR;
  const phones=[s.phone,s.phone2].filter(Boolean).join(', ');
  const bal=est?0:r2(num(b.total)-num(b.paid));
  const discAmt=r2(num(b.discAmt));
  const adj=r2(num(b.adj));
  const fitAmt=r2(num(b.fittingAmt));
  const delAmt=r2(num(b.deliveryAmt));
  const rndAmt=r2(num(b.roundAmt));
  const rate=num(b.gstRate),tax=r2(num(b.tax)),half=r2(tax/2);
  let totQty=0;

  const itemRows=b.items.map((l,i)=>{
    totQty+=num(l.qty);
    const sf=sqFtLabel(l.size);
    const aAmt=r2(num(l.addonAmt));
    const aName=(l.addonName||'').trim();
    const descParts=[];
    if((l.desc||'').trim())descParts.push(esc(l.desc.trim()));
    if(aAmt>0||aName)descParts.push(`+ ${esc(aName||'Additional Charge')}${aAmt>0?' (₹'+money(aAmt)+')':''}`);
    return `<tr data-brk>
      <td class="c">${i+1}</td>
      <td><b>${esc(l.name)}</b>${descParts.length?`<div style="font-size:11.5px;color:#444;margin-top:2px">${descParts.join(' · ')}</div>`:''}</td>
      <td class="c">${esc(l.size||'-')}${sf?`<div style="font-size:10.5px;color:#333;font-weight:600;margin-top:1px">(${esc(sf)})</div>`:''}</td>
      <td class="c">${qtyF(l.qty)} ${esc(l.unit||'')}</td>
      <td class="r">${money(l.rate)}</td>
      <td class="r"><b>${money(l.amt)}</b></td>
    </tr>`;
  }).join('');

  let extraRows='';
  if(fitAmt>0)extraRows+=`<tr class="bw-subrow"><td class="c"></td><td style="text-align:right;font-weight:600">${esc(b.fittingName||'Fitting Charges')}</td><td class="c">-</td><td class="c">-</td><td class="r">${money(fitAmt)}</td><td class="r">${money(fitAmt)}</td></tr>`;
  if(delAmt>0)extraRows+=`<tr class="bw-subrow"><td class="c"></td><td style="text-align:right;font-weight:600">${esc(b.deliveryName||'Transport / Delivery')}</td><td class="c">-</td><td class="c">-</td><td class="r">${money(delAmt)}</td><td class="r">${money(delAmt)}</td></tr>`;
  if(discAmt>0)extraRows+=`<tr class="bw-subrow"><td class="c"></td><td style="text-align:right;font-weight:600">${T.disc} (${num(b.discPct)}%)</td><td class="c">-</td><td class="c">-</td><td class="r">− ${money(discAmt)}</td><td class="r">− ${money(discAmt)}</td></tr>`;
  if(adj!==0)extraRows+=`<tr class="bw-subrow"><td class="c"></td><td style="text-align:right;font-weight:600">${T.adj}</td><td class="c">-</td><td class="c">-</td><td class="r">${adj>0?'+':'−'} ${money(Math.abs(adj))}</td><td class="r">${adj>0?'+':'−'} ${money(Math.abs(adj))}</td></tr>`;
  if(gst){
    if(b.gstSplit==='inter')extraRows+=`<tr class="bw-subrow"><td class="c"></td><td style="text-align:right">${T.igst} (${rate}%)</td><td class="c">-</td><td class="c">-</td><td class="r">${money(tax)}</td><td class="r">${money(tax)}</td></tr>`;
    else{
      extraRows+=`<tr class="bw-subrow"><td class="c"></td><td style="text-align:right">${T.cgst} (${rate/2}%)</td><td class="c">-</td><td class="c">-</td><td class="r">${money(half)}</td><td class="r">${money(half)}</td></tr>`;
      extraRows+=`<tr class="bw-subrow"><td class="c"></td><td style="text-align:right">${T.sgst} (${rate/2}%)</td><td class="c">-</td><td class="c">-</td><td class="r">${money(r2(tax-half))}</td><td class="r">${money(r2(tax-half))}</td></tr>`;
    }
  }
  if(rndAmt!==0)extraRows+=`<tr class="bw-subrow"><td class="c"></td><td style="text-align:right">${T.rnd}</td><td class="c">-</td><td class="c">-</td><td class="r">${rndAmt>0?'+':'−'} ${money(Math.abs(rndAmt))}</td><td class="r">${rndAmt>0?'+':'−'} ${money(Math.abs(rndAmt))}</td></tr>`;

  const docTitle=gst?T.taxInvoice:(est?'QUOTATION':T.invoice);
  const showBank=!!b.showBank;
  const showQr=!!b.showQr;
  const paySection=(showBank||showQr)?`<div class="bw-paygrid" data-brk style="${(!showBank||!showQr)?'grid-template-columns:1fr':''}">

function fitInv(){
  const w=document.getElementById('invwrap');if(!w)return;
  const inv=w.firstElementChild;if(!inv)return;
  const k=Math.min(1,(w.clientWidth||794)/794);
  inv.style.transform='scale('+k+')';
  w.style.height=Math.ceil(inv.offsetHeight*k)+'px';
}
window.addEventListener('resize',fitInv);
function paginate(H,PH,cands){
  if(H<=PH+2)return[{s:0,e:H,off:0}];
  const pages=[];let s=0,first=true;
  while(s<H-1){
    const off=first?0:40,cap=PH-off-24;
    let e=s+cap;
    if(H-s<=PH-off){e=H}
    else{let best=0;cands.forEach(c=>{if(c>s+60&&c<=e)best=c});if(best)e=best}
    pages.push({s,e,off});s=e;first=false;
  }
  return pages;
}
async function loadFonts(lang){
  try{
    const jobs=[document.fonts.load('400 13px "Noto Sans"'),document.fonts.load('600 13px "Noto Sans"'),document.fonts.load('700 13px "Noto Sans"')];
    if(lang==='gu'){jobs.push(document.fonts.load('400 13px "Noto Sans Gujarati"','ગુજરાતી'),document.fonts.load('700 13px "Noto Sans Gujarati"','ગુજરાતી'))}
    if(lang==='hi'){jobs.push(document.fonts.load('400 13px "Noto Sans Devanagari"','हिन्दी'),document.fonts.load('700 13px "Noto Sans Devanagari"','हिन्दी'))}
    await Promise.race([Promise.all(jobs),new Promise(r=>setTimeout(r,5000))]);
    await document.fonts.ready;
  }catch(e){}
}
let pdfBusy=false;
async function savePdf(b,lang,doneMsg,tplOverride){
  if(pdfBusy)return;
  if(!window.html2canvas||!(window.jspdf&&window.jspdf.jsPDF)){toast('The PDF tools did not load. Reload the page and try again.');return}
  if(!dl){toast('Saving files is not available in this view.');return}
  pdfBusy=true;toast('Preparing PDF...');
  let stage=document.getElementById('pdfstage');
  if(!stage){stage=document.createElement('div');stage.id='pdfstage';document.body.appendChild(stage)}
  try{
    stage.innerHTML=invoiceHTML(b,lang,tplOverride);
    await loadFonts(lang);
    const el=stage.firstElementChild;
    const H=el.offsetHeight,top0=el.getBoundingClientRect().top;
    const cands=[...el.querySelectorAll('[data-brk]')].map(x=>Math.round(x.getBoundingClientRect().top-top0)).sort((a,c)=>a-c);
    const cv=await window.html2canvas(el,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false,onclone:d=>{const c=d.getElementById('pdfstage');if(c){c.style.left='0px';c.style.top='0px'}}});
    const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait',compress:true});
    const PH=1122,k=cv.width/794;
    paginate(H,PH,cands).forEach((pg,idx)=>{
      const c2=document.createElement('canvas');c2.width=cv.width;c2.height=Math.round(PH*k);
      const x=c2.getContext('2d');x.fillStyle='#ffffff';x.fillRect(0,0,c2.width,c2.height);
      const sh=Math.round((pg.e-pg.s)*k);
      x.drawImage(cv,0,Math.round(pg.s*k),cv.width,sh,0,Math.round(pg.off*k),cv.width,sh);
      if(idx)pdf.addPage();
      pdf.addImage(c2.toDataURL('image/jpeg',0.93),'JPEG',0,0,210,297);
    });
    const nm=(b.customer||'').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
    await dl.save({filename:(b.type==='estimate'?'Estimate-'+String(b.no).replace(/^E/,''):'Bill-'+b.no)+(nm?'-'+nm:'')+'.pdf',data:pdf.output('blob')});
    toast(doneMsg||'PDF saved');
  }catch(e){if(!(e&&e.code==='declined'))toast('Could not make the PDF. Try again.')}
  finally{stage.innerHTML='';pdfBusy=false}
}

  if(d.length===10)return '91'+d;

  return '';
}

/* ---------- bills list ---------- */
function filteredBills(){
  const q=ui.billq.trim().toLowerCase();
  const st=ui.billStatus||'all';
  const tp=ui.billType||'all';
  const from=ui.billFrom||'';
  const to=ui.billTo||'';
  return Object.values(S.bills).sort((a,b)=>(b.created||0)-(a.created||0)).filter(b=>{
    if(q&&!(String(b.no).toLowerCase()===q||(b.customer||'').toLowerCase().includes(q)||b.items.some(l=>l.name.toLowerCase().includes(q))))return false;
    if(from&&(!b.date||b.date<from))return false;
    if(to&&(!b.date||b.date>to))return false;
    const bType=b.type||'normal';
    if(tp==='gst'&&bType!=='gst')return false;
    if(tp==='nongst'&&bType!=='normal')return false;
    if(tp==='estimate'&&bType!=='estimate')return false;
    const bal=bType==='estimate'?0:r2(num(b.total)-num(b.paid));
    if(st==='paid')return b.status!=='cancelled'&&bType!=='estimate'&&bal<=0;
    if(st==='pending')return b.status!=='cancelled'&&bType!=='estimate'&&bal>0;
    if(st==='cancelled')return b.status==='cancelled';
    return true;
  });
}
function billSummaryHTML(list){
  const active=list.filter(b=>b.status!=='cancelled'&&b.type!=='estimate');
  const tot=r2(active.reduce((s,b)=>s+num(b.total),0));
  const due=r2(active.reduce((s,b)=>s+Math.max(0,r2(num(b.total)-num(b.paid))),0));
  return `${list.length} bill${list.length===1?'':'s'}${active.length?` · Total <b class="tn" style="color:var(--fg)">${inr(tot)}</b>`:''}${due>0?` · Pending <b class="tn" style="color:var(--gold-ink)">${inr(due)}</b>`:''}`;
}
function viewBills(){
  const canc=Object.values(S.bills).filter(b=>b.status==='cancelled').length;
  const list=filteredBills();
  const hasFilter=ui.billq.trim()||(ui.billStatus&&ui.billStatus!=='all')||(ui.billType&&ui.billType!=='all')||ui.billFrom||ui.billTo;
  return `<div class="row" style="margin-bottom:12px"><h1>Bills</h1><span class="sp"></span>${canc?`<button class="btn sm bad" data-act="delcancelled">Delete cancelled (${canc})</button>`:''}<a class="btn gold" href="#newbill" style="text-decoration:none">New bill</a></div>
  <input class="in" id="billq" placeholder="Search by name, item or bill number" value="${esc(ui.billq)}" style="margin-bottom:10px" aria-label="Search bills">
  <div class="chips" style="margin-bottom:8px" id="billchips">${[['all','All Status'],['paid','Paid'],['pending','Pending'],['cancelled','Cancelled']].map(x=>`<button class="chip ${(ui.billStatus||'all')===x[0]?'on':''}" data-act="billst" data-v="${x[0]}">${x[1]}</button>`).join('')}</div>
  <div class="chips" style="margin-bottom:10px" id="billtypechips">${[['all','All Types'],['gst','GST'],['nongst','Non-GST'],['estimate','Estimated']].map(x=>`<button class="chip ${(ui.billType||'all')===x[0]?'on':''}" data-act="billtp" data-v="${x[0]}">${x[1]}</button>`).join('')}</div>
  <div class="row" style="margin-bottom:10px;gap:8px">
    <div style="flex:1 1 130px;min-width:120px"><label class="f" for="billfrom">From date</label><input class="in" id="billfrom" type="date" value="${esc(ui.billFrom||'')}"></div>
    <div style="flex:1 1 130px;min-width:120px"><label class="f" for="billto">To date</label><input class="in" id="billto" type="date" value="${esc(ui.billTo||'')}"></div>
    ${hasFilter?`<div style="align-self:end"><button class="btn sm" data-act="billreset">Clear filters</button></div>`:''}
  </div>
  <div class="small muted" id="billsummary" style="margin-bottom:8px">${billSummaryHTML(list)}</div>
  <div class="panel list" id="billlist">${billListHTML(list)}</div>`;
}
function billListHTML(pre){
  const all=pre||filteredBills();
  return all.length?all.slice(0,200).map(billRow).join(''):'<div class="empty">No matching bills found.</div>';
}

function openModal(title,body,onSubmit,submitLabel){
  $('#modal').innerHTML=`<div class="modal" data-act="mclose"><form class="box" id="mform"><div class="row" style="margin-bottom:12px"><h2>${esc(title)}</h2><span class="sp"></span><button type="button" class="btn sm" data-act="mclose2">Close</button></div>${body}${onSubmit?`<div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn pri" type="submit">${esc(submitLabel||'Save')}</button></div>`:''}</form></div>`;
  const f=$('#mform');
  f.addEventListener('submit',async ev=>{ev.preventDefault();if(onSubmit){const r=await onSubmit(new FormData(f));if(r!==false)closeModal()}});
  const first=f.querySelector('input,select');if(first)setTimeout(()=>first.focus(),30);
}
function closeModal(){$('#modal').innerHTML='';render()}

function prodFromForm(fd,old){
  const p=Object.assign({},old||{log:[]});
  p.sr=Math.max(1,Math.floor(num(fd.get('sr'))||nextStockSr()));
  p.name=String(fd.get('name')||'').trim();p.cat=fd.get('cat');p.size=String(fd.get('size')||'').trim();p.unit=fd.get('unit');
  p.billBy='unit';
  p.sell=num(fd.get('sell'));p.buy=num(fd.get('buy'));p.min=num(fd.get('min'));
  const ns=num(fd.get('stock'));
  if(old&&ns!==num(old.stock)){p.log=(old.log||[]).concat([{d:today(),t:'adj',q:r2(ns-num(old.stock)),ref:'Edited'}]).slice(-40)}
  p.stock=ns;return p;
}
function openProd(id){
  const p=S.products[id];if(!p)return;
  const log=(p.log||[]).slice().reverse().slice(0,8);
  const body=`<div class="row" style="margin-bottom:10px"><div><b style="font-size:16px">${p.sr?'#'+esc(p.sr)+' · ':''}${esc(p.name)}</b><div class="muted small">${esc(p.size?p.size+' · ':'')}${esc(p.cat)}</div></div><span class="sp"></span><div style="text-align:right"><b class="tn" style="font-size:22px">${num(p.stock)}</b> <span class="muted">${esc(p.unit)}</span></div></div>
  <div class="row" style="margin-bottom:14px"><button type="button" class="btn pri sm" data-act="stockin" data-id="${esc(id)}">Stock in</button><button type="button" class="btn sm" data-act="adjust" data-id="${esc(id)}">Set count</button><button type="button" class="btn sm" data-act="editprod" data-id="${esc(id)}">Edit item</button><button type="button" class="btn sm bad" data-act="delprod" data-id="${esc(id)}">Delete</button></div>
  <div class="small muted" style="margin-bottom:6px">Recent movement</div>
  ${log.length?`<table class="t"><tbody>${log.map(x=>`<tr><td>${fmtDate(x.d)}</td><td>${esc(x.ref||x.t)}</td><td class="r tn" style="color:${x.q<0?'var(--bad)':'var(--ok)'}">${x.q>0?'+':''}${x.q}</td></tr>`).join('')}</tbody></table>`:'<div class="muted small">No movement recorded yet.</div>'}`;
  openModal(p.name,body,null);
}
async function adjustStock(id,delta,type,ref,extra){
  const p=clone(S.products[id]);p.stock=r2(num(p.stock)+delta);
  p.log=(p.log||[]).concat([{d:today(),t:type,q:delta,ref}]).slice(-40);
  if(extra&&extra.buy)p.buy=extra.buy;
  await put('products',id,p);
}

  if(l==='hi')return `नमस्ते ${n}, अल-बुरहानी ग्लास एंड एल्युमिनियम में आपका ${a} बाकी है। कृपया भुगतान कर दें। धन्यवाद।`;
  return `Hello ${n}, this is a reminder from ${s}. ${a} is pending on your account. Please make the payment at your convenience. Thank you.`;

let orderDraft=null;

  const ps=prodList();
  const low=ps.filter(p=>stockState(p)!=='ok');

  const rowsH=ps.map(p=>`<div class="li" style="cursor:default;padding:8px 0"><div class="g"><b>${p.sr?'#'+esc(p.sr)+' · ':''}${esc(p.name)}</b><span class="muted small">${esc(p.size||p.cat)} · stock ${num(p.stock)}</span></div><input class="in num" style="width:84px" data-oq="${esc(p.id)}" inputmode="decimal" placeholder="0" value="${esc(orderDraft[p.id]||'')}" aria-label="Order quantity for ${esc(p.name)}"></div>`).join('');
  openModal('New order list',ps.length?`<label class="f" for="o-sup">Supplier (optional)</label><input class="in" id="o-sup" name="supplier"><div class="small muted" style="margin:10px 0 4px">Enter a quantity for each item to order. Items at or below their alert level are filled in.</div><div class="list">${rowsH}</div>`:'<div class="empty">Add stock items first.</div>',ps.length?async fd=>{

/* ---------- reports ---------- */
function periodRange(p){
  const t=new Date(),y=t.getFullYear(),m=t.getMonth();
  if(p==='today')return[today(),today(),'Today'];
  if(p==='week'){const f=new Date(t);f.setDate(f.getDate()-6);return[dstr(f),today(),'Last 7 days']}
  if(p==='month')return[y+'-'+pad2(m+1)+'-01',today(),'This month'];
  if(p==='year')return[y+'-01-01',today(),'This year'];
  return['0000-00-00','9999-99-99','All time'];
}
function viewReports(){
  const [from,to,label]=periodRange(ui.period);
  const bills=activeBills().filter(b=>b.date>=from&&b.date<=to);
  const sales=sumTotal(bills);
  const collected=r2(bills.reduce((s,b)=>s+num(b.paid),0)+Object.values(S.payments).filter(p=>p.date>=from&&p.date<=to).reduce((s,p)=>s+num(p.amount),0));
  const items={};bills.forEach(b=>b.items.forEach(l=>{const k=l.name+(l.size?' '+l.size:'');const o=items[k]||(items[k]={name:k,qty:0,amt:0});o.qty+=l.qty;o.amt+=l.amt}));
  const top=Object.values(items).sort((a,b)=>b.amt-a.amt).slice(0,8);
  const cats={};bills.forEach(b=>b.items.forEach(l=>{const k=l.cat||'Other';cats[k]=(cats[k]||0)+l.amt}));
  const days=[];for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(dstr(d))}
  const ds=days.map(d=>sumTotal(activeBills().filter(b=>b.date===d)));
  return `<div class="row" style="margin-bottom:12px"><h1>Reports</h1><span class="sp"></span><button class="btn sm" data-act="csv">Save as spreadsheet (CSV)</button></div>
  <div class="chips" style="margin-bottom:14px">${[['today','Today'],['week','7 days'],['month','This month'],['year','This year'],['all','All time']].map(x=>`<button class="chip ${ui.period===x[0]?'on':''}" data-act="period" data-v="${x[0]}">${x[1]}</button>`).join('')}</div>
  <div class="panel stats"><div><small>${label}: sales</small><strong class="tn">${inr(sales)}</strong></div><div><small>Bills</small><strong class="tn">${bills.length}</strong></div><div><small>Average bill</small><strong class="tn">${inr(bills.length?sales/bills.length:0)}</strong></div><div><small>Money received</small><strong class="tn">${inr(collected)}</strong></div></div>
  <div class="sec"><h2>Sales, last 14 days</h2></div><div class="panel pad">${chartSVG(days,ds)}</div>
  <div class="grid2" style="margin-top:20px;align-items:start"><section><div class="sec" style="margin-top:0"><h2>Top items</h2></div><div class="panel scroll"><table class="t"><thead><tr><th>Item</th><th class="r">Qty</th><th class="r">Amount</th></tr></thead><tbody>${top.length?top.map(t=>`<tr><td>${esc(t.name)}</td><td class="r tn">${r2(t.qty)}</td><td class="r tn">${inr(t.amt)}</td></tr>`).join(''):'<tr><td colspan="3" class="muted">No sales in this period.</td></tr>'}</tbody></table></div></section>

}
function niceMax(v){if(v<=0)return 1000;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return(n<=1?1:n<=2?2:n<=5?5:10)*p}
function chartSVG(days,vals){
  const W=640,H=190,L=46,R=8,T=10,B=26;const max=niceMax(Math.max.apply(null,vals));
  const bw=(W-L-R)/days.length;const y=v=>T+(H-T-B)*(1-v/max);
  let g='';[0,.5,1].forEach(f=>{const v=max*f;g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v>=1000?(v/1000)+'k':v}</text>`});
  const bars=days.map((d,i)=>{const h=(H-T-B)*vals[i]/max;return `<rect class="bar1 ${i===days.length-1?'now':''}" x="${L+i*bw+bw*.18}" y="${y(vals[i])}" width="${bw*.64}" height="${Math.max(h,vals[i]?1:0)}" rx="2"><title>${fmtDate(d)}: ${inr(vals[i])}</title></rect><text x="${L+i*bw+bw/2}" y="${H-8}" text-anchor="middle">${+d.slice(8)}</text>`}).join('');
  return `<div class="scroll"><svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" style="min-width:420px" role="img" aria-label="Daily sales for the last 14 days">${g}${bars}</svg></div>`;
}
function csvCell(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function exportCSV(){
  const [from,to]=periodRange(ui.period);
  const rows=[['Bill no','Date','Customer','Item','Size','Qty','Unit','Rate','Additional Charge','Amount','Fitting','Delivery','Discount','Bill total','Paid','Balance','Status']];
  Object.values(S.bills).filter(b=>b.type!=='estimate'&&b.date>=from&&b.date<=to).sort((a,b)=>(a.created||0)-(b.created||0)).forEach(b=>b.items.forEach(l=>rows.push([b.no,b.date,b.customer,l.name,l.size,l.qty,l.unit,l.rate,l.addonAmt||0,l.amt,b.fittingAmt||0,b.deliveryAmt||0,b.discAmt||0,b.total,b.paid,r2(b.total-b.paid),b.status])));
  saveFile('al-burhani-sales-'+ui.period+'.csv',rows.map(r=>r.map(csvCell).join(',')).join('\n'));
}

function fileToDataUrl(file,maxW,maxH){
  return new Promise((res,rej)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>maxW||h>maxH){const r=Math.min(maxW/w,maxH/h);w=Math.round(w*r);h=Math.round(h*r)}
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        res(c.toDataURL('image/png'));
      };
      img.onerror=rej;img.src=reader.result;
    };
    reader.onerror=rej;reader.readAsDataURL(file);
  });
}

async function restore(file){
  try{
    const j=JSON.parse(await file.text());let n=0;
    for(const c of COLS){const o=j[c];if(o&&typeof o==='object'){for(const id of Object.keys(o)){await put(c,id,o[id]);n++}}}
    toast('Loaded '+n+' records');render();
  }catch(e){toast('That file is not a valid backup.')}
}

document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='stockq'){ui.q=t.value;$('#stocklist').innerHTML=stockListHTML();return}
  if(t.id==='billq'){ui.billq=t.value;const l=filteredBills();$('#billlist').innerHTML=billListHTML(l);const s=$('#billsummary');if(s)s.innerHTML=billSummaryHTML(l);return}
  if(t.dataset&&t.dataset.oq)return;
  if(ui.route==='newbill')onBillInput(e);
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='v-lang'){ui.vlang=t.value;ui.vbill=String(ui.arg);render();return}
  if(t.id==='v-tpl'){ui.vtpl=t.value;ui.vbill=String(ui.arg);render();return}
  if(t.id==='billfrom'){ui.billFrom=t.value;render();return}
  if(t.id==='billto'){ui.billTo=t.value;render();return}
  if(t.id==='restore'&&t.files[0]){restore(t.files[0]);t.value='';return}
  if((t.id==='up-logo'||t.id==='up-insta'||t.id==='up-qr'||t.id==='up-sign')&&t.files[0]){
    try{
      const key=t.id==='up-logo'?'logoImg':(t.id==='up-insta'?'instaQrImg':(t.id==='up-qr'?'qrImg':'signImg'));
      const dataUrl=await fileToDataUrl(t.files[0],360,360);
      const o=Object.assign({},S.shop.main||{});o[key]=dataUrl;
      await put('shop','main',o);
      toast('Image uploaded & saved');render();
    }catch(err){toast('Could not load image.')}
    t.value='';return;
  }
  if(ui.route==='newbill')onBillInput(e);
});
document.addEventListener('submit',async e=>{
  if(e.target.id==='shopform'){
    e.preventDefault();const fd=new FormData(e.target);const o=Object.assign({},S.shop.main||{});
    ['name','gu1','gu2','tag','addrGu','contact','phone','phone2','pan','gstin','br1','br2','br3','defaultTpl','terms1','terms2','bankAccName','bankName','bankAccNo','bankIfsc','upiId','igHandle'].forEach(k=>{o[k]=String(fd.get(k)||'').trim()});
    o.nextBill=Math.max(1,Math.floor(num(fd.get('nextBill'))||236));
    const th=String(fd.get('theme')||'light');
    if(th==='dark'||th==='light'){pref.theme=th;savePref()}
    await put('shop','main',o);toast('All settings saved');if(draft&&!S.bills['B'+draft.no])draft.no=nextNo(draft.type);render();
  }
});
if(window.__ALBUR_TEST)window.__albur={words,amtWords,lineAmt,VIEWS,ACTS,S,put,saveBill,newDraft,validateBill,billTotals,customersMap,orderText,invoiceHTML,paginate,memAdd,memFlush,memArr,fillLists,waNumber,waMsg,waLink,I18N,remindText,chartSVG,setDraft:d=>{draft=d},getDraft:()=>draft,ui,adjustStock,nextNo,shop,rowHTML};
boot();
})();
</script>

</body></html>
